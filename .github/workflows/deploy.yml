name: Deploy Blog

on:
  push:
    branches:
      - main

# ⭐ 防重复部署（关键）
concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Server
        env:
          # 远程先清除脚本里Windows换行，再执行；加 bash -x 打印详细执行日志定位报错
          REMOTE_CMD: cd /home/admin/projects && ls -la && sed -i 's/\r$//' deploy.sh && bash -x deploy.sh
        run: |
          ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/id_ed25519 \
            admin@${{ secrets.SERVER_HOST }} \
            bash -c "$REMOTE_CMD"