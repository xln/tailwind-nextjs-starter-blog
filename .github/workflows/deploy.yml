name: Deploy Blog

on:
  push:
    branches:
      - main

# ⭐ 防重复部署（关键）
concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to Server (debug first)
        run: |
          ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/id_ed25519 \
            -p ${{ secrets.SERVER_PORT }} \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            'bash -lc "
              echo ===== DEBUG INFO =====
              whoami
              echo HOME: \$HOME
              pwd

              echo ===== PROJECT DIR =====
              ls -la /home/admin/projects || true

              echo ===== DEPLOY FILE =====
              ls -l /home/admin/projects/deploy.sh || true

              echo ===== RUN DEPLOY =====
              bash /home/admin/projects/deploy.sh
            "'
